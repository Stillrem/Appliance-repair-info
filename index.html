<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Appliance Repair Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
  :root {
    --primary:#34c759; --primary-dark:#30d158; --background:#111; --surface:#232324; --surface-2:#29292B;
    --surface-3:#323236; --text:#fff; --text-secondary:#bcbcc7; --border:#34343B; --shadow:rgba(0,0,0,0.24);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--background);color:var(--text);margin:0;}
  .container{max-width:640px;margin:0 auto;min-height:100vh;padding:24px 6vw 36px;}
  .header{text-align:center;margin-top:8px;margin-bottom:32px;}
  .logo{width:62px;height:62px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:15px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 18px rgba(52,199,89,0.18);}
  .title{font-size:2rem;font-weight:800;margin-bottom:7px;text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .subtitle{color:var(--text-secondary);font-size:16px;font-weight:500;}
  .mode-toggle{display:flex;max-width:300px;margin:23px auto 0;background:var(--surface);border-radius:12px;box-shadow:inset 0 1px 3px var(--shadow);}
  .mode-btn{flex:1;padding:13px 10px;border:none;background:none;color:var(--text-secondary);border-radius:9px;font-weight:700;font-size:15px;transition:all .22s cubic-bezier(.25,.46,.45,.94);cursor:pointer;}
  .mode-btn.active{background:var(--primary);color:var(--text);box-shadow:0 2px 8px rgba(52,199,89,0.23);}
  form,.form-section,.report-output{width:100%;box-sizing:border-box;}
  .form-section{background:var(--surface);border-radius:18px;padding:26px 21px 22px;margin-bottom:20px;border:1.4px solid var(--border);box-shadow:0 2px 22px rgba(0,0,0,0.07);}
  @media(max-width:600px){.form-section{padding:18px 6vw;}}
  .section-title{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:17px;}
  .form-group{margin-bottom:23px;display:flex;flex-direction:column;align-items:stretch;}
  .form-group:last-child{margin-bottom:0;}
  .label{font-weight:650;margin-bottom:6px;margin-top:2px;color:var(--text);font-size:15.4px;}
  .translation{color:var(--text-secondary);font-size:13.3px;font-style:italic;display:block;}
  .translation.hidden{display:none;}
  select,input,textarea{width:100%;padding:14px 14px 13px;background:var(--surface-2);border:1.3px solid var(--border);border-radius:10px;color:var(--text);font-size:15.5px;font-family:inherit;transition:border .21s,background .21s;appearance:none;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);}
  select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bbbbbb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 15px center;background-size:18px;padding-right:43px;cursor:pointer;}
  textarea{min-height:90px;resize:vertical;line-height:1.54;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:540px){.form-row{grid-template-columns:1fr;gap:13px;}}
  .action-buttons{display:flex;gap:11px;margin-top:33px;}
  .btn{flex:1;padding:14px 0;border:none;border-radius:11px;font-weight:700;font-size:15.7px;transition:background .19s,transform .14s;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--text);}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-primary:hover{background:var(--primary-dark);filter:brightness(1.04);}
  .btn-secondary:hover{background:var(--surface-3);}
  .report-output{background:var(--surface);border-radius:17px;padding:25px 10px 22px;margin-top:32px;border:1.2px solid var(--border);}
  .report-title{font-size:20px;font-weight:700;margin-bottom:14px;color:var(--primary);display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .report-content{line-height:1.7;}
  .report-line{margin-bottom:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .report-line:last-child{border-bottom:none;margin-bottom:0;}
  .report-label{font-weight:600;color:var(--text-secondary);font-size:13.2px;text-transform:uppercase;letter-spacing:0.3px;}
  .report-value{font-size:15.6px;color:var(--text);}
  .report-actions{display:flex;gap:8px;}
  .templates{margin-top:25px;}
  .input-dollar{position:relative;display:flex;align-items:center;}
  .input-dollar .dollar-sign{display:inline-block;width:27px;min-width:27px;text-align:center;font-size:17px;color:#aaa;pointer-events:none;line-height:1;margin-right:2px;}
  .select-group{display:flex;align-items:center;gap:3px;}
  .custom-add-btn{background:var(--primary);color:#fff;border:none;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:17px;margin-left:3px;}
  .custom-add-btn:hover{background:var(--primary-dark);}
  .custom-del-btn{background:#f34e4e;color:#fff;border:none;border-radius:7px;padding:3px 9px;font-size:17px;cursor:pointer;display:inline-block;vertical-align:middle;margin-left:2px;}
  .custom-del-btn:hover{background:#c93434;}
  #allReportsBlock > .report-output{margin-top:18px;}
  #reportsControlBtns{margin-bottom:24px;display:flex;gap:8px;}
  ::selection{background:var(--primary-dark);color:#fff;}
  @media (max-width:540px){.container{padding:9px 0 29px;}}
  @media print {.action-buttons,.mode-toggle,#reportsControlBtns,.header{display:none !important;} body{background:#fff;} .container{max-width:800px;} .report-output{page-break-inside:avoid;border:0}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🔧</div>
    <h1 class="title">Appliance Repair Pro</h1>
    <p class="subtitle">Professional Service Reports</p>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="technician">👨‍🔧 Technician</button>
      <button class="mode-btn" data-mode="client">👤 Client</button>
    </div>
  </div>

  <form id="repairForm" autocomplete="off">
    <div class="form-section">
      <div class="section-title">🏠 Appliance Information</div>
      <div class="form-group">
        <label class="label">Appliance Type <span class="translation">Тип техники</span></label>
        <select id="category" required>
          <option value="">Select Appliance Type</option>
          <option value="refrigerator">Refrigerator / Холодильник</option>
          <option value="dishwasher">Dishwasher / ПММ</option>
          <option value="washing_machine">Washing Machine / Стиралка</option>
          <option value="dryer">Dryer / Сушилка</option>
          <option value="stove_oven">Stove/Oven / Плита–Духовка</option>
          <option value="microwave">Microwave / Микроволновка</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">Brand <span class="translation">Бренд</span></label>
          <div class="select-group">
            <select id="brand" required><option value="">Select Brand</option></select>
            <button type="button" class="custom-add-btn" onclick="promptAddCustom('brand')" title="Add Brand">+</button>
          </div>
        </div>
        <div class="form-group">
          <label class="label">Model <span class="translation">Модель</span></label>
          <input type="text" id="model" placeholder="Enter model number" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">Serial Number <span class="translation">Серийный номер</span></label>
          <input type="text" id="serial" placeholder="Enter serial number" />
        </div>
        <div class="form-group">
          <label class="label">Year of Manufacture <span class="translation">Месяц и год выпуска (MM.YYYY или MM/YYYY)</span></label>
          <input type="text" id="year" placeholder="MM.YYYY или MM/YYYY" pattern="^(0[1-9]|1[0-2])[./](19|20)\d\d$" maxlength="7"/>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">🔍 Service Details</div>
      <div class="form-group">
        <label class="label">Problem <span class="translation">Проблема</span></label>
        <div class="select-group">
          <select id="problem" required style="flex:1"><option value="">Select Problem</option></select>
          <button type="button" class="custom-add-btn" onclick="promptAddCustom('problem')" title="Add Problem">+</button>
          <button type="button" class="custom-del-btn" id="delCustomProblem" style="display:none" title="Delete this custom option">🗑️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Diagnosis <span class="translation">Диагноз</span></label>
        <div class="select-group">
          <select id="diagnosis" required style="flex:1"><option value="">Select Diagnosis</option></select>
          <button type="button" class="custom-add-btn" onclick="promptAddCustom('diagnosis')" title="Add Diagnosis">+</button>
          <button type="button" class="custom-del-btn" id="delCustomDiagnosis" style="display:none" title="Delete this custom option">🗑️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Action Taken <span class="translation">Выполненные действия</span></label>
        <div class="select-group">
          <select id="action" required style="flex:1"><option value="">Select Action</option></select>
          <button type="button" class="custom-add-btn" onclick="promptAddCustom('action')" title="Add Action">+</button>
          <button type="button" class="custom-del-btn" id="delCustomAction" style="display:none" title="Delete this custom option">🗑️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Status <span class="translation">Статус</span></label>
        <select id="status" required>
          <option value="">Select Status</option>
          <option value="completed">✅ Fixed 100% / Полностью исправлено</option>
          <option value="waiting">⏳ Waiting for Part / Ожидание запчасти</option>
          <option value="temporary">🔧 Temporary Fix / Временное решение</option>
          <option value="unrepairable">❌ Not Repairable / Не подлежит ремонту</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Additional Notes <span class="translation">Дополнительные заметки</span></label>
        <textarea id="notes" placeholder="Enter any additional details or recommendations..."></textarea>
      </div>
      <div class="form-group input-dollar">
        <label class="label">Repair Cost <span class="translation">Стоимость ремонта</span></label>
        <span class="dollar-sign" aria-label="Dollar">$</span>
        <input type="number" id="price" placeholder="0" min="0" step="1" inputmode="numeric" />
      </div>
    </div>

    <div class="action-buttons">
      <button type="submit" class="btn btn-primary">📋 Generate Report</button>
      <button type="button" id="clearBtn" class="btn btn-secondary">🗑️ Clear Form</button>
    </div>
  </form>

  <div id="allReportsBlock"></div>
</div>

<!-- Подключаем готовые массивы (50 шт) -->
<script src="data50.js"></script>
<script>
/* ================== ГЛОБАЛ ================== */
let currentMode = 'technician';

// кастом-опции (починено: есть brand + безопасное обращение)
let customOptions = JSON.parse(localStorage.getItem('customOptionsV3')||'{}');
customOptions = Object.assign({brand:{},problem:{},diagnosis:{},action:{}}, customOptions);

// отчёты
let allReports = JSON.parse(localStorage.getItem('repairReportsV2')||'[]');

// автосохранение формы
const formFields = ['category','brand','model','serial','year','problem','diagnosis','action','status','notes','price'];
function saveForm(){ 
  const snap = {}; formFields.forEach(id=>snap[id]=document.getElementById(id).value||'');
  localStorage.setItem('repairFormAutosave', JSON.stringify(snap));
}
function restoreForm(){
  const snap = JSON.parse(localStorage.getItem('repairFormAutosave')||'{}');
  if (snap.category) { category.value=snap.category; updateLists(); }
  // отложенно наполним бренды/проблемы, потом проставим значения
  setTimeout(()=>{ formFields.forEach(id=>{ if(snap[id]){ const el=document.getElementById(id); if(el) el.value=snap[id]; }); checkCustomDelBtns(); }, 0);
}
formFields.forEach(id=>{ const el=()=>document.getElementById(id); 
  document.addEventListener('change', e=>{ if(e.target && e.target.id===id) saveForm(); });
  document.addEventListener('input',  e=>{ if(e.target && e.target.id===id) saveForm(); });
});

/* ========= Помощники заполнения и переводов ========= */
function fillSelect(select, arr, cat, key) {
  select.innerHTML = '<option value="">Select '+key.charAt(0).toUpperCase()+key.slice(1)+'</option>';
  const bucket = (customOptions[key]||{});            // безопасность
  const custom = (bucket[cat]||[]);
  const merged = arr.concat(custom);
  merged.forEach(o=>{
    if (typeof o==='string') { // бренды
      select.innerHTML += `<option value="${o}">${o}</option>`;
    } else {
      select.innerHTML += `<option value="${o.en}">${o.en}</option>`;
    }
  });
}

function updateLists() {
  const cat = category.value;
  if (!cat) return;
  fillSelect(brand,    window.brandsMap[cat],    cat, 'brand');
  fillSelect(problem,  window.problemsMap[cat],  cat, 'problem');
  fillSelect(diagnosis,window.diagnosisMap[cat], cat, 'diagnosis');
  fillSelect(action,   window.actionsMap[cat],   cat, 'action');
  checkCustomDelBtns();
}

function checkCustomDelBtns() {
  const cat = category.value;
  ['problem','diagnosis','action'].forEach(key=>{
    const sel = document.getElementById(key);
    const delBtn = document.getElementById('delCustom'+key.charAt(0).toUpperCase()+key.slice(1));
    const customs = ((customOptions[key]||{})[cat]||[]);
    if(!sel || !delBtn) return;
    const selected = sel.value;
    const idx = customs.findIndex(o=>(o.en||o)===selected);
    delBtn.style.display = idx!==-1 ? 'inline-block' : 'none';
    delBtn.onclick = ()=>delCustomOption(key,cat,selected);
  });
}

function delCustomOption(key,cat,val) {
  if(confirm("Remove custom '"+val+"'?")) {
    customOptions[key][cat] = (customOptions[key][cat]||[]).filter(o=>(o.en||o)!==val);
    localStorage.setItem('customOptionsV3',JSON.stringify(customOptions));
    updateLists();
  }
}

function promptAddCustom(type){
  const cat = category.value;
  if(!cat){ alert('Choose Appliance Type first'); return; }
  const en = prompt("Enter new "+type+" (EN):");
  if(!en || !en.trim()) return;
  const ru = (type==='brand') ? en : (prompt("Введите перевод "+type+" (RU):", en) || en);
  const obj = (type==='brand') ? en : {en,ru};
  customOptions[type][cat] = customOptions[type][cat] || [];
  customOptions[type][cat].push(obj);
  localStorage.setItem('customOptionsV3',JSON.stringify(customOptions));
  updateLists();
}

/* ========= Режим Technician/Client ========= */
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentMode = btn.dataset.mode;
    document.querySelectorAll('.translation').forEach(el=>{
      el.classList.toggle('hidden', currentMode==='client');
    });
    renderReports();
  };
});

/* ========= Утилиты ========= */
function prettyYear(val){
  if(!val) return '';
  const m = val.replace(/[^\d]/g,'').padStart(6,'0');
  return m.length>=6 ? (m.slice(0,2)+'.'+m.slice(2,6)) : val;
}
const ENRU = (arr,val)=>(arr.find(o=>o.en===val)||arr.find(o=>o===val)||{}); // для брендов вернёт {}

function buildReportObject(){
  const cat=category.value, gv=id=>document.getElementById(id).value.trim();
  const problemEN = gv('problem'), diagnosisEN = gv('diagnosis'), actionEN = gv('action');
  const pb = ENRU(window.problemsMap[cat]||[], problemEN);
  const dg = ENRU(window.diagnosisMap[cat]||[], diagnosisEN);
  const ac = ENRU(window.actionsMap[cat]||[],   actionEN);
  return {
    ts: Date.now(),
    date: new Date().toLocaleString(),
    mode: currentMode,
    category: cat,
    brand: gv('brand'),
    model: gv('model'),
    serial: gv('serial'),
    year: prettyYear(gv('year')),
    problem_en: problemEN,   problem_ru: pb.ru || problemEN,
    diagnosis_en: diagnosisEN, diagnosis_ru: dg.ru || diagnosisEN,
    action_en: actionEN,       action_ru: ac.ru || actionEN,
    status: gv('status'),
    notes: gv('notes'),
    price: gv('price') || '0'
  };
}

function reportText(r){
  // текстовый отчёт EN+RU (в Technician показ обе строки)
  const isTech = r.mode==='technician';
  const line = (lblEN, valEN, valRU) => isTech ? `${lblEN}: ${valEN} — ${valRU}` : `${lblEN}: ${valEN}`;
  return [
    `Appliance: ${r.category}`,
    `Brand: ${r.brand}`,
    `Model: ${r.model}`,
    `Serial: ${r.serial}`,
    `Year: ${r.year}`,
    line('Problem', r.problem_en, r.problem_ru),
    line('Diagnosis', r.diagnosis_en, r.diagnosis_ru),
    line('Action', r.action_en, r.action_ru),
    `Status: ${r.status}`,
    `Notes: ${r.notes}`,
    `Price: $${r.price}`
  ].join('\n');
}

function makeReportBlock(r){
  const isTech = r.mode==='technician';
  const title = isTech ? 'Technician Report' : 'Client Report';
  const date = r.date.replace(/:\d+$/,'');
  const line = (label, en, ru) => {
    const ruSpan = isTech ? `<div class="translation" style="margin-top:2px">${ru}</div>` : '';
    return `<div class="report-line">
      <div class="report-label">${label}</div>
      <div class="report-value">${en}${ruSpan}</div>
    </div>`;
  };

  const body = `
    ${line('Appliance', r.category, '')}
    ${line('Brand', r.brand, r.brand)}
    ${line('Model', r.model, r.model)}
    ${line('Serial', r.serial, r.serial)}
    ${line('Year', r.year, r.year)}
    ${line('Problem', r.problem_en, r.problem_ru)}
    ${line('Diagnosis', r.diagnosis_en, r.diagnosis_ru)}
    ${line('Action', r.action_en, r.action_ru)}
    ${line('Status', r.status, r.status)}
    ${line('Notes', r.notes, r.notes)}
    ${line('Price', '$'+r.price, '$'+r.price)}
  `;

  return `<div class="report-output" data-ts="${r.ts}">
    <div class="report-title">
      <span>${title} <span style="font-size:13px;color:#bcbcc7;">(${date})</span></span>
      <span class="report-actions">
        <button class="btn btn-secondary" onclick="copyReport(${r.ts})">Copy</button>
        <button class="btn btn-secondary" onclick="shareWhatsApp(${r.ts})">WhatsApp</button>
        <button class="btn btn-secondary" onclick="printReport(${r.ts})">Print</button>
      </span>
    </div>
    <div class="report-content">${body}</div>
  </div>`;
}

function renderReports(){
  const cont = document.getElementById('allReportsBlock');
  const ctrl = (allReports.length?`<div id="reportsControlBtns">
    <button class="btn btn-secondary" onclick="copyLastReport()">Copy Last</button>
    <button class="btn btn-secondary" onclick="copyAllReports()">Copy All</button>
    <button class="btn btn-secondary" onclick="clearReports()">Clear All</button>
    <button class="btn btn-secondary" onclick="window.print()">Print Page</button>
  </div>`:'');
  cont.innerHTML = ctrl + allReports.map(makeReportBlock).join('');
}

/* ========= Копирование/Шеринг/Печать ========= */
function getReportByTs(ts){ return allReports.find(r=>r.ts===ts); }
function copy(text){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }

function copyReport(ts){ const r=getReportByTs(ts); if(!r) return; copy(reportText(r)); alert('Copied!'); }
function copyLastReport(){ if(allReports.length) copy(reportText(allReports[allReports.length-1])); else alert('No reports'); }
function copyAllReports(){ if(!allReports.length) return alert('No reports'); copy(allReports.map(reportText).join('\n\n---\n\n')); alert('Copied all!'); }
function clearReports(){ if(confirm('CLEAR ALL REPORTS?')){ allReports=[]; localStorage.removeItem('repairReportsV2'); renderReports(); } }

function shareWhatsApp(ts){
  const r=getReportByTs(ts); if(!r) return;
  const url='https://wa.me/?text='+encodeURIComponent(reportText(r));
  window.open(url,'_blank');
}

function printReport(ts){
  const block = document.querySelector(`.report-output[data-ts="${ts}"]`);
  if(!block) return;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Report ${ts}</title>
    <style>body{font-family:Arial,sans-serif;padding:20px} .report-output{max-width:760px;margin:0 auto}</style>
  </head><body>${block.outerHTML}</body></html>`);
  win.document.close();
  win.focus();
  win.print();
  win.close();
}

/* ========= Обработчики формы ========= */
category.onchange = ()=>{ updateLists(); checkCustomDelBtns(); saveForm(); };
['problem','diagnosis','action','brand','model','serial','year','status','notes','price'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.onchange = checkCustomDelBtns;
});

clearBtn.onclick = ()=>{
  repairForm.reset();
  localStorage.removeItem('repairFormAutosave');
  updateLists(); checkCustomDelBtns();
};

repairForm.onsubmit = (e)=>{
  e.preventDefault();
  const r = buildReportObject();
  allReports.push(r);
  localStorage.setItem('repairReportsV2', JSON.stringify(allReports));
  renderReports();
  alert('Report Generated & Saved!');
};

/* ========= Старт ========= */
window.onload = ()=>{
  // наполняем списки по выбранной категории (если восстановим из автосейва)
  if (category.value) updateLists();
  renderReports();
  restoreForm();
  if(currentMode==='client'){
    document.querySelectorAll('.translation').forEach(e=>e.classList.add('hidden'));
  }
};
</script>
</body>
</html>
