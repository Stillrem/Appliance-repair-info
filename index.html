<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Appliance Repair Pro — Glass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
  /* ====== THEME ====== */
  :root{
    --primary:#52E0A5;
    --primary-2:#3AC7E0;
    --ink:#E9F7F2;
    --muted:#BFD6CD;
    --bg:#0B1211;
    --glass:rgba(255,255,255,.08);
    --glass-2:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.28);
    --inner:rgba(255,255,255,.55);
    --shadow:rgba(0,0,0,.45);
    --bg-image:url('IMG_0463.png'); /* подложка */
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial;
    color:var(--ink);
    background:var(--bg);
    overflow-x:hidden;
  }

  /* BACKGROUND */
  .page-bg{position:fixed; inset:0;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(255,255,255,.08) 0%, transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(122,255,194,.05) 0%, transparent 60%),
      var(--bg);}
  .page-bg::before{content:""; position:absolute; inset:0;
    background-image:var(--bg-image); background-size:cover; background-position:center;
    filter:contrast(.9) saturate(.9) brightness(.65); opacity:.85;}
  .page-bg::after{content:""; position:absolute; inset:0;
    background:
      radial-gradient(1200px 900px at 50% -10%, rgba(255,255,255,.12), transparent 55%),
      radial-gradient(1200px 900px at 50% 110%, rgba(0,0,0,.45), transparent 60%);
    pointer-events:none; mix-blend-mode:screen;}

  /* GLASS + LAYOUT */
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.08), 0 20px 40px -16px var(--shadow);}
  .glass-2{background:var(--glass-2);border:1px solid rgba(255,255,255,.22);backdrop-filter: blur(14px) saturate(140%);-webkit-backdrop-filter: blur(14px) saturate(140%);}
  .container{position:relative;max-width:760px;margin:0 auto;min-height:100svh;padding:32px 6vw 40px;}

  .header{text-align:center;margin:8px 0 26px;}
  .logo{width:76px;height:76px;margin:0 auto 14px;display:grid;place-items:center;border-radius:20px;
    background:linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.35);backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 18px 40px -18px var(--shadow);
    color:#0C1A17;font-size:30px;}
  .title{margin:0 0 6px;font-size:2.2rem;font-weight:900;letter-spacing:.5px;color:transparent;
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.55) 40%, rgba(255,255,255,.2) 70%),
              radial-gradient(120% 180% at 0% 0%, rgba(146,255,215,.55), transparent 40%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1px rgba(255,255,255,.25);
    text-shadow:0 2px 10px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.25);}
  .subtitle{color:var(--muted);font-weight:600;letter-spacing:.2px;opacity:.95;text-shadow:0 1px 0 rgba(0,0,0,.35);}

  .mode-toggle{display:flex;gap:8px;padding:6px;max-width:360px;margin:18px auto 0;}
  .mode-btn{flex:1;border:0;cursor:pointer;border-radius:12px;padding:12px 10px;font-weight:800;font-size:15px;color:var(--ink);opacity:.75;
    transition:all .2s ease;background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.22);backdrop-filter: blur(10px) saturate(150%);}
  .mode-btn:hover{opacity:1}
  .mode-btn.active{opacity:1;background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.05)),
                                   linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color:rgba(255,255,255,.35);color:#0D1A17;box-shadow:0 10px 24px -12px rgba(64,224,208,.45);}

  .form-section{padding:22px 18px 18px;margin-bottom:18px}
  .section-title{font-size:17px;font-weight:900;letter-spacing:.3px;margin:2px 0 14px;color:transparent;
    background:linear-gradient(180deg, #CFFFEF, #7EF3C2 60%, #4ED6F0);-webkit-background-clip:text;background-clip:text;
    -webkit-text-stroke:.6px rgba(255,255,255,.35);text-shadow:0 2px 12px rgba(0,0,0,.45);}
  .form-group{margin-bottom:18px;display:flex;flex-direction:column}
  .label{font-weight:750;margin:4px 0 8px;font-size:14px;color:var(--ink);opacity:.95}
  .translation{color:var(--muted);font-size:12.5px;font-style:italic;display:block}
  .hidden{display:none !important;}
  .select-group{display:flex;align-items:center;gap:6px}
  .form-row{display:grid; gap:12px;}
  @media (min-width:720px){ .form-row{grid-template-columns: 1fr 1fr;} }

  select,input,textarea{width:100%;padding:13px 14px;color:var(--ink);border-radius:12px;border:1px solid rgba(255,255,255,.28);
    background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
    backdrop-filter: blur(8px) saturate(130%);-webkit-backdrop-filter: blur(8px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.25);
    transition:border-color .2s, box-shadow .2s, transform .06s;appearance:none;}
  select{background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2388BCAF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat;background-position:right 14px center;background-size:18px;padding-right:44px}
  textarea{min-height:92px;resize:vertical;line-height:1.55}
  select:focus,input:focus,textarea:focus{outline:none;border-color:rgba(255,255,255,.55);
    box-shadow:0 0 0 3px rgba(82,224,165,.25), inset 0 1px 0 rgba(255,255,255,.45);}

  .input-dollar{display:flex;align-items:center}
  .input-dollar .dollar-sign{width:28px;min-width:28px;text-align:center;margin-right:4px;font-weight:800;
    color:rgba(233,247,242,.85); text-shadow:0 1px 0 rgba(0,0,0,.45);}

  .custom-add-btn,.custom-del-btn,.btn{border-radius:12px;border:1px solid rgba(255,255,255,.28);
    padding:10px 12px;font-weight:800;cursor:pointer;background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    color:var(--ink);transition:transform .08s ease, box-shadow .2s ease, background .2s ease;backdrop-filter: blur(8px) saturate(130%);}
  .custom-add-btn{background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)),
                             linear-gradient(135deg,var(--primary),var(--primary-2)); color:#0E1A17}
  .custom-del-btn{background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); color:#ffb7b7}
  .custom-add-btn:hover,.btn-primary:hover{box-shadow:0 12px 30px -14px rgba(82,224,165,.6)}
  .custom-del-btn:hover{box-shadow:0 10px 26px -14px rgba(255,100,100,.5)}

  .action-buttons{display:flex;gap:10px;margin-top:24px}
  .btn{flex:1;font-size:15.6px}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08)),
                           linear-gradient(135deg,var(--primary),var(--primary-2)); color:#0E1A17;}
  .btn-secondary{color:var(--ink)}

  /* Reports */
  .reports-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  @media (min-width:720px){ .reports-grid{grid-template-columns:1fr 1fr;} }
  .report-output{margin:0;padding:0;border-radius:18px;border:1px solid var(--stroke);background:var(--glass);backdrop-filter: blur(16px) saturate(160%);-webkit-backdrop-filter: blur(16px) saturate(160%);box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.08), 0 20px 40px -16px var(--shadow);display:flex;flex-direction:column;min-height:240px;}
  .report-title{ padding:16px 16px 6px; margin:0; font-weight:900;font-size:18px;color:transparent;background:linear-gradient(180deg, #EFFFF7, #9FF0D2 50%, #6FE0F2);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.6px rgba(255,255,255,.35); }
  .report-content{ padding:8px 16px 12px; line-height:1.62; flex:1; }
  .report-line{ padding:8px 0; border-bottom:1px solid rgba(255,255,255,.18); }
  .report-line:last-child{ border-bottom:none; }
  .report-label{font-size:12px;letter-spacing:.28px;color:var(--muted);text-transform:uppercase}
  .report-value{font-size:15.6px;color:var(--ink)}
  .report-actions{display:flex; gap:8px; padding:12px 12px 14px; border-top:1px solid rgba(255,255,255,.18);}
  .btn-mini{ flex:1; text-align:center; padding:10px 12px; border-radius:10px; font-size:13.5px; }

  /* Edit banner */
  #editBanner{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:0 0 12px;border-radius:12px}
  #editBanner strong{letter-spacing:.2px}
  #cancelEditBtn{flex:0 0 auto}

  @media (max-width:560px){
    .container{padding:14px 4vw 28px}
    .title{font-size:1.85rem}
  }
  @supports not ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))){
    .glass,.glass-2,.form-section,select,input,textarea,.mode-btn,.btn,.report-output{background-color:rgba(255,255,255,.08);}
  }

  /* Панель: Copy Last / Copy All / Clear All */
  #reportsControlBtns{
    display:flex;gap:10px;margin-top:14px
  }
  #reportsControlBtns .btn{
    flex:1;text-align:center;font-size:14px;padding:10px 12px;border-radius:10px
  }
  </style>
</head>

<body>
  <div class="page-bg" aria-hidden="true"></div>

  <div class="container">
    <div class="header">
      <div class="logo glass">🔧</div>
      <h1 class="title">Appliance Repair Pro</h1>
      <p class="subtitle">Professional Service Reports</p>

      <div class="mode-toggle glass" role="tablist" aria-label="Mode switch">

    <!-- ==== ФОРМА ==== -->

        <div class="section-title" id="applianceInfo">🏠 Appliance Information</div>

        <div class="form-group">
          <label class="label" for="category">Appliance Type <span class="translation">Тип техники</span></label>
          <div class="select-group">
            <select id="category" name="category"><option value="">Select Appliance Type</option></select>

<script>
/* ===== Ticket counter (resets daily) ===== */
const TICKET_KEY = 'ticketCounterDailyV1';

function getTodayISO(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`; // YYYY-MM-DD
}

function nextTicketNumber(){
  let data = {};
  try{ data = JSON.parse(localStorage.getItem(TICKET_KEY) || '{}'); }catch(e){ data = {}; }
  const today = getTodayISO();
  if(data.date !== today){ data = { date: today, n: 0 }; }
  data.n = (data.n||0) + 1;
  localStorage.setItem(TICKET_KEY, JSON.stringify(data));
  return data.n;
}

function resetTicketCounter(){
  const today = getTodayISO();
  localStorage.setItem(TICKET_KEY, JSON.stringify({ date: today, n: 0 }));
}

/* ========= BUILT-IN CATEGORIES ========= */
const builtinCategories = [

];

/* ========= DATA (EN–RU) ========= */
/* Refrigerator */
const brandsFridge = ["LG","Samsung","Whirlpool","GE","Bosch","Siemens","Electrolux","Frigidaire","KitchenAid","Maytag","Hitachi","Liebherr","Sharp","Indesit","Hotpoint","Viking","Beko","Kenmore","Haier","Panasonic","Zanussi","Daewoo","Gorenje","Amana","Candy","Ariston","Miele","Sub-Zero","Smeg","Turboair","Vestfrost","Atlant","Nord","Vestel","Krups","Schaub Lorenz","Blomberg","Grundig","Crosley","Hisense","Toshiba","Winia","Baumatic","Bomann","Brandt","Fisher & Paykel","Teka","Neff","Silverline"];

(function migrateV3(){
  const v3 = localStorage.getItem('customOptionsV3');
  if(!v3) return;
  try{
    const old = JSON.parse(v3);
    ['brand','problem','diagnosis','action'].forEach(k=>{
      const obj = old[k]||{};
      Object.keys(obj).forEach(cat=>{
        custom[k][cat] = (custom[k][cat]||[]).concat(obj[cat]);
      });
    });
    localStorage.removeItem('customOptionsV3');
    localStorage.setItem('customOptionsV4',JSON.stringify(custom));
  }catch(e){}
})();

function categoryList(){ return [...builtinCategories, ...custom.category]; }

function mapsFor(catKey){
  const brands = (builtinBrands[catKey]||[]).concat( (custom.brand[catKey]||[]) );
  const problems = (builtinProblems[catKey]||[]).concat( (custom.problem[catKey]||[]) );
  const diagnosis = (builtinDiagnosis[catKey]||[]).concat( (custom.diagnosis[catKey]||[]) );
  const actions = (builtinActions[catKey]||[]).concat( (custom.action[catKey]||[]) );
  return {brands,problems,diagnosis,actions};
}

function ensureCustomCategory(catKey, en, ru){
  if(!custom.category.find(c=>c.key===catKey)){
    custom.category.push({key:catKey,en,ru});
  }
  if(!custom.problem[catKey]||custom.problem[catKey].length===0) custom.problem[catKey]=JSON.parse(JSON.stringify(universalProblems));
  if(!custom.diagnosis[catKey]||custom.diagnosis[catKey].length===0) custom.diagnosis[catKey]=JSON.parse(JSON.stringify(universalDiagnosis));
  if(!custom.action[catKey]||custom.action[catKey].length===0) custom.action[catKey]=JSON.parse(JSON.stringify(universalActions));
  if(!custom.brand[catKey]) custom.brand[catKey]=[];
  persistCustom();
}

function persistCustom(){ localStorage.setItem('customOptionsV4',JSON.stringify(custom)); }

/* fill select helpers */
function fillCategory(){
  const current=els.category.value;
  els.category.innerHTML='<option value="">Select Appliance Type</option>';
  const showRu = (currentMode==='technician');
  categoryList().forEach(c=>{
    const label = showRu && c.ru && c.ru!==c.en ? `${c.en} / ${c.ru}` : c.en;
    els.category.innerHTML += `<option value="${c.key}">${label}</option>`;
  });
  if(current && categoryList().some(c=>c.key===current)) els.category.value=current;
}

function fillSelectENorObj(select, arr, placeholder){
  select.innerHTML = `<option value="">${placeholder}</option>`;
  arr.forEach(o=>{
    if (typeof o === 'string') {
      select.innerHTML += `<option value="${o}">${o}</option>`;
    } else {
      const isPayment = (select.id === 'payment');
      const showRu = !isPayment && currentMode === 'technician' && o.ru && o.ru !== o.en;
      const label = showRu ? `${o.en} / ${o.ru}` : o.en;
      select.innerHTML += `<option value="${o.en}">${label}</option>`;
    }
  });
}

function fillStatus(){
  const list = [...builtinStatuses, ...(custom.status||[])];
  fillSelectENorObj(els.status, list, 'Select Status');
}

function fillPayment(){
  fillSelectENorObj(els.payment, builtinPayments, 'Select Payment Method'); // только EN
}

function fillRequestType(){ /* уже есть в HTML */ }

/* main update */
function updateLists(opts = {}) {
  const reset = opts.resetOnCategoryChange === true;

  const prev = {
    category: els.category.value,
    brand: els.brand.value,
    problem: els.problem.value,
    diagnosis: els.diagnosis.value,
    action: els.action.value,
    status: els.status.value,
    payment: els.payment.value,
    requestType: els.requestType.value
  };

  fillCategory();

  if (prev.category && categoryList().some(c => c.key === prev.category)) {
    els.category.value = prev.category;
  }

  const cat = els.category.value;
  const categoryChanged = prev.category !== cat;
  const doReset = reset || categoryChanged;

  if (!cat) {
    ['brand','problem','diagnosis','action'].forEach(id => {
      els[id].innerHTML = `<option value="">Select ${id[0].toUpperCase()+id.slice(1)}</option>`;
    });
    fillStatus();
    fillPayment();
    fillRequestType();
    els.status.value = '';
    els.payment.value = '';
    els.requestType.value = '';
    checkDelButtons();
    return;
  }

  const {brands, problems, diagnosis, actions} = mapsFor(cat);
  fillSelectENorObj(els.brand,     brands,    'Select Brand');
  fillSelectENorObj(els.problem,   problems,  'Select Problem');
  fillSelectENorObj(els.diagnosis, diagnosis, 'Select Diagnosis');
  fillSelectENorObj(els.action,    actions,   'Select Action');
  fillStatus();
  fillPayment();
  fillRequestType();

  if (!doReset) {
    if (prev.brand)       els.brand.value       = prev.brand;
    if (prev.problem)     els.problem.value     = prev.problem;
    if (prev.diagnosis)   els.diagnosis.value   = prev.diagnosis;
    if (prev.action)      els.action.value      = prev.action;
    if (prev.status)      els.status.value      = prev.status;
    if (prev.payment)     els.payment.value     = prev.payment;
    if (prev.requestType) els.requestType.value = prev.requestType;
  } else {
    els.brand.value       = '';
    els.problem.value     = '';
    els.diagnosis.value   = '';
    els.action.value      = '';
    els.status.value      = '';
    els.payment.value     = '';
    els.requestType.value = '';
    ['model','serial','year','notes','sc'].forEach(k => els[k].value = '');
  }

  checkDelButtons();
}

/* delete buttons visibility */
function checkDelButtons(){
  const cat=els.category.value;

  const isCustomCat = custom.category.some(c=>c.key===cat);
  els.delCustomCategory.style.display = (cat && isCustomCat)?'inline-block':'none';

  const check = (key, selectEl, btnEl)=>{
    if(!cat){ btnEl.style.display='none'; return; }
    const customs=(custom[key][cat]||[]);
    const val = selectEl.value;
    const idx = customs.findIndex(o=> (typeof o==='string'?o:(o.en||''))===val );
    btnEl.style.display = (idx!==-1)?'inline-block':'none';
    btnEl.onclick = ()=>delCustomOption(key,cat,val);
  };
  check('brand',els.brand,els.delCustomBrand);
  check('problem',els.problem,els.delCustomProblem);
  check('diagnosis',els.diagnosis,els.delCustomDiagnosis);
  check('action',els.action,els.delCustomAction);

  const stVal = els.status.value;
  const stIdx = (custom.status||[]).findIndex(o=>o.en===stVal);
  els.delCustomStatus.style.display = stIdx!==-1?'inline-block':'none';
  els.delCustomStatus.onclick = ()=>delCustomStatus(stVal);
}

/* adders / deleters */
function promptAddCategory(){
  const en=prompt("Enter new Appliance Type (EN):"); if(!en||!en.trim()) return;
  const ru=prompt("Введите перевод Appliance Type (RU):",en)||en;
  const key = slugify(en);
  ensureCustomCategory(key,en.trim(),(ru||en).trim());
  persistCustom();
  updateLists();
  els.category.value = key;
  updateLists();
}

function promptAddCustom(type){
  const cat=els.category.value;
  if(type!=='status' && !cat){ alert('Choose Appliance Type first'); return; }

  const en=prompt(`Enter new ${type} (EN):`); if(!en||!en.trim()) return;
  const ru = (type==='brand')? null : (prompt(`Введите перевод ${type} (RU):`,en)||en);

  if(type==='status'){
    custom.status = custom.status||[];
    custom.status.push({en:en.trim(), ru:(ru||en).trim()});
  }else if(type==='brand'){
    custom.brand[cat]=custom.brand[cat]||[];
    custom.brand[cat].push(en.trim());
  }else{
    custom[type][cat]=custom[type][cat]||[];
    custom[type][cat].push({en:en.trim(), ru:(ru||en).trim()});
  }
  persistCustom();
  updateLists();
  if(type==='status') els.status.value=en.trim(); else document.getElementById(type).value=en.trim();
  checkDelButtons();
}

function delCustomOption(key,cat,val){
  if(!confirm("Remove custom '"+val+"'?")) return;
  custom[key][cat]=(custom[key][cat]||[]).filter(o=> (typeof o==='string'?o:(o.en||''))!==val );
  persistCustom(); updateLists();
}

function delCustomCategory(){
  const cat=els.category.value;
  const obj = custom.category.find(c=>c.key===cat);
  if(!obj) return;
  if(!confirm(`Delete custom type '${obj.en}'? All its custom lists will be removed.`)) return;
  custom.category = custom.category.filter(c=>c.key!==cat);
  delete custom.brand[cat];
  delete custom.problem[cat];
  delete custom.diagnosis[cat];
  delete custom.action[cat];
  persistCustom();
  els.category.value='';
  updateLists();
}

function delCustomStatus(valEN){
  if(!confirm(`Remove custom status '${valEN}'?`)) return;
  custom.status=(custom.status||[]).filter(s=>s.en!==valEN);
  persistCustom(); updateLists();
}

/* translations (find RU) */
function findRuInList(arr,val){
  if(!val) return ''; if(!arr||!arr.length) return '';
  if(typeof arr[0]==='string') return val;
  const f=arr.find(o=>o.en===val);
  return f ? (f.ru||val) : val;
}

function findCategoryRuByKey(key){
  const c = categoryList().find(x=>x.key===key);
  if(!c) return '';
  return (c.ru && c.ru !== c.en) ? c.ru : '';
}
  
function findStatusRu(val){
  const list=[...builtinStatuses,...(custom.status||[])];
  const f=list.find(s=>s.en===val);
  return f ? (f.ru||val) : val;
}

/* Report builders */
function prettyYear(val){
  const s=(val||'').trim(); if(!s) return '';
  if(/^\d{2}[./-]\d{4}$/.test(s)) return s;
  const digits=s.replace(/[^\d]/g,''); if(digits.length===6){
    const delim=s.includes('/')?'/':(s.includes('-')?'-':'.'); return `${digits.slice(0,2)}${delim}${digits.slice(2)}`;
  }
  return s;
}
function lineENRU(label,en,ru){
  if(!en && !ru) return '';
  if(currentMode==='technician' && ru && en && ru!==en) return `<div class="report-line"><span class="report-label">${label}:</span> <span class="report-value">${en} / ${ru}</span></div>`;
  return `<div class="report-line"><span class="report-label">${label}:</span> <span class="report-value">${en||ru||''}</span></div>`;
}
function reportToPlainText(r){
  const title = r.mode==='technician' ? 'Technician Report' : 'Client Report';
  const header = `Заявка №${r.ticketNo || '-'} — ${title} (${r.date})`;

  // помощник: EN / RU в зависимости от режима
  const fmt = (en, ru) => {
    const e = (en ?? '').toString().trim();
    const u = (ru ?? '').toString().trim();
    if (!e && !u) return '';
    if (currentMode === 'technician' && u && e && u !== e) return `${e} / ${u}`;
    return e || u;
  };

  // строки как параграфы (между ними будет пустая строка)
  const paragraphs = [];

  paragraphs.push(header);

  const appliance = fmt((r.categoryLabel||'').split(' / ')[0], findCategoryRuByKey(r.category));
  if (appliance) paragraphs.push(`Appliance: ${appliance}`);

  const brand = fmt(r.brand, r.brand_ru);
  if (brand) paragraphs.push(`Brand: ${brand}`);

  if (r.model?.trim()) paragraphs.push(`Model: ${r.model.trim()}`);
  if (r.serial?.trim()) paragraphs.push(`Serial: ${r.serial.trim()}`);
  if (r.year?.trim())   paragraphs.push(`Year: ${r.year.trim()}`);

  if (r.requestType?.trim()) paragraphs.push(`Request Type: ${r.requestType.trim()}`);

  const problem = fmt(r.problem, r.problem_ru);
  if (problem) paragraphs.push(`Problem: ${problem}`);

  const diagnosis = fmt(r.diagnosis, r.diagnosis_ru);
  if (diagnosis) paragraphs.push(`Diagnosis: ${diagnosis}`);

  const action = fmt(r.action, r.action_ru);
  if (action) paragraphs.push(`Action: ${action}`);

  const status = fmt(r.status, r.status_ru);
  if (status) paragraphs.push(`Status: ${status}`);

  // Notes — сохраняем переносы строк, но оформляем отдельным параграфом
  if ((r.notes ?? '').toString().trim() !== '') {
    const notesBlock = (r.notes || '').toString().replace(/\r?\n/g, '\n');
    paragraphs.push(`Notes:\n${notesBlock}`);
  }

  if ((r.address ?? '').toString().trim() !== '') {
    paragraphs.push(`Address: ${r.address}`);
}
  
  const scStr = (r.sc ?? '').toString().trim();
  if (scStr !== '') paragraphs.push(`SC: $${scStr}`);

  const pay = (r.payment ?? '').toString().trim();
  if (pay) paragraphs.push(`Payment: ${pay}`);

  // КЛЮЧЕВОЕ: двойной перенос между блоками
  return paragraphs.join('\n\n');
}

/* makeReportObj — сохраняем ticket/date при редактировании */
function makeReportObj(existing=null){
  const catKey=els.category.value;
  const catObj = categoryList().find(c=>c.key===catKey) || {};
  const catLabel = catObj.en || '';
  const m=mapsFor(catKey||'');
  const dateOnly = existing ? existing.date : new Date().toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'});

  return {
    date: dateOnly,
    mode: currentMode,
    category: catKey,
    categoryLabel: catLabel,
    brand: els.brand.value||'',
    brand_ru: findRuInList(m.brands, els.brand.value),
    model: (els.model.value||'').trim(),
    serial: (els.serial.value||'').trim(),
    year: prettyYear((els.year.value||'').trim()),
    requestType: (els.requestType.value||'').trim(),
    problem: els.problem.value||'',
    problem_ru: findRuInList(m.problems, els.problem.value),
    diagnosis: els.diagnosis.value||'',
    diagnosis_ru: findRuInList(m.diagnosis, els.diagnosis.value),
    action: els.action.value||'',
    action_ru: findRuInList(m.actions, els.action.value),
    status: els.status.value||'',
    status_ru: findStatusRu(els.status.value),
    notes: (els.notes.value||'').trim(),
    address: (els.address.value ||'').trim(),
    sc: (els.sc.value||'').trim(),
    payment: els.payment.value||'',
    ticketNo: existing ? existing.ticketNo : nextTicketNumber(),
  };
}

/* RENDER */
function makeReportBlock(r,idx){
  const ticketLabel=`Заявка №${r.ticketNo||'-'}`;
  const title=(r.mode==='technician'?'Technician Report':'Client Report');
  let html=`<div class="report-output" data-idx="${idx}">
    <div class="report-title">${ticketLabel} — ${title} <span style="font-size:13px;color:#bcbcc7;">(${r.date})</span></div>
    <div class="report-content">`;
  // на случай старых отчётов, где en/ru склеены — оставим только EN до " / "
  const catEN = (r.categoryLabel||'').split(' / ')[0];
  html += lineENRU('Appliance', catEN, findCategoryRuByKey(r.category));
  html+=lineENRU('Brand',r.brand,r.brand_ru);
  html+=lineENRU('Model',r.model,'');
  html+=lineENRU('Serial',r.serial,'');
  html+=lineENRU('Year',r.year,'');
  html+=lineENRU('Request Type',r.requestType,'');
  html+=lineENRU('Problem',r.problem,r.problem_ru);
  html+=lineENRU('Diagnosis',r.diagnosis,r.diagnosis_ru);
  html+=lineENRU('Action',r.action,r.action_ru);
  html+=lineENRU('Status',r.status,r.status_ru);
  html+=lineENRU('Notes',r.notes,'');
  html+=lineENRU('Address', r.address,'');
  const scStr=(r.sc??'').toString().trim(); if(scStr!=='') html+=lineENRU('SC',`$${scStr}`,'');
  const payStr=(r.payment??'').toString().trim(); if(payStr!=='') html+=lineENRU('Payment',payStr,'');
  html+=`</div>
    <div class="report-actions">
      <button class="btn btn-secondary btn-mini" onclick="startEdit(${idx})">Edit</button>
      <button class="btn btn-secondary btn-mini" onclick="copyReport(${idx})">Copy</button>
      <button class="btn btn-secondary btn-mini" onclick="shareWhatsApp(${idx})">WhatsApp</button>
      <button class="btn btn-secondary btn-mini" onclick="printReport(${idx})">Print</button>
      <button class="btn btn-secondary btn-mini" onclick="deleteReport(${idx})">Delete</button>
    </div>
  </div>`;
  return html;
}

function renderReports(){
  if(!allReports.length){
    els.reportsBlock.innerHTML='';
    return;
  }
  let cards='';
  allReports.forEach((r,i)=>{ cards+=makeReportBlock(r,i); });
  els.reportsBlock.innerHTML=`
    <div id="reportsControlBtns">
      <button class="btn btn-secondary" onclick="copyLastReport()">Copy Last</button>
      <button class="btn btn-secondary" onclick="copyAllReports()">Copy All</button>
      <button class="btn btn-secondary" onclick="clearReports()">Clear All</button>
    </div>
    <div class="reports-grid">${cards}</div>`;
}

/* ===== Edit mode ===== */
function startEdit(idx){
  const r=allReports[idx]; if(!r) return;
  editingIndex=idx;
  els.category.value=r.category||'';
  updateLists({resetOnCategoryChange:true});
  ['brand','model','serial','year','requestType','problem','diagnosis','action','status','notes','sc','payment'].forEach(k=>{
    if(els[k]) els[k].value = (r[k]??'');
  });
  els.genBtn.textContent='💾 Save Changes';
  els.editBannerText.innerHTML=`<strong>Editing ticket №${r.ticketNo}</strong> — ${r.date}`;
  els.editBanner.style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}
els.cancelEditBtn.onclick=()=>{
  editingIndex=null;
  els.genBtn.textContent='📋 Generate Report';
  els.editBanner.style.display='none';
};

/* Actions */
function copyToClipboard(text){
  const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t);
  t.select(); document.execCommand('copy'); document.body.removeChild(t);
  alert('Copied!');
}
function copyReport(idx){ copyToClipboard(reportToPlainText(allReports[idx])); }
function copyLastReport(){ if(allReports.length) copyReport(allReports.length-1); else alert('No reports'); }
function copyAllReports(){
  if(!allReports.length) return alert('No reports');
  copyToClipboard(allReports.map(reportToPlainText).join('\n\n-------------------\n\n'));
}
function shareWhatsApp(idx){ const text=encodeURIComponent(reportToPlainText(allReports[idx])); window.open(`https://wa.me/?text=${text}`,'_blank'); }
function printReport(idx){
  const text=reportToPlainText(allReports[idx]).replace(/\n/g,'<br>');
  const w=window.open('','_blank','width=720,height=900');
  w.document.write(`<html><head><title>Report</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:24px;line-height:1.5}</style></head><body>${text}</body></html>`);
  w.document.close(); w.focus(); w.print();
}
function deleteReport(idx){
  if(!confirm('Delete this report?')) return;
  allReports.splice(idx,1);
  localStorage.setItem('repairReportsV3',JSON.stringify(allReports));
  renderReports();
}
function clearReports(){
  if(!confirm('CLEAR ALL REPORTS?')) return;
  allReports=[];
  localStorage.removeItem('repairReportsV3');
  resetTicketCounter();
  renderReports();
  alert('All reports cleared. Ticket counter reset for today.');
}

/* Autosave form */
const FORM_KEY='repairFormStateV4';
function saveForm(){
  const data={mode:currentMode,category:els.category.value,brand:els.brand.value,model:els.model.value,serial:els.serial.value,year:els.year.value,requestType:els.requestType.value,problem:els.problem.value,diagnosis:els.diagnosis.value,action:els.action.value,status:els.status.value,notes:els.notes.value,address:els.address.value,sc:els.sc.value,payment:els.payment.value};
  localStorage.setItem(FORM_KEY,JSON.stringify(data));
}
function loadForm(){
  const raw=localStorage.getItem(FORM_KEY); if(!raw) return;
  const d=JSON.parse(raw);
  if(d.mode){ currentMode=d.mode; updateModeButtons(); }
  if(d.category){ els.category.value=d.category; }
  updateLists();
  ['brand','model','serial','year','requestType','problem','diagnosis','action','status','notes','address','sc','payment'].forEach(k=>{
    if(d[k]!==undefined && d[k]!==null){ els[k].value=d[k]; }
  });
  checkDelButtons();
}

/* Mode + translations */
function updateModeButtons(){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  (currentMode==='technician'?els.modeTech:els.modeClient).classList.add('active');
  Array.from(document.querySelectorAll('.translation')).forEach(el=>{
    el.classList.toggle('hidden', currentMode==='client');
  });
  updateLists();
}

/* Events */
els.modeTech.onclick=()=>{ currentMode='technician'; updateModeButtons(); saveForm(); renderReports(); };
els.modeClient.onclick=()=>{ currentMode='client'; updateModeButtons(); saveForm(); renderReports(); };

els.category.addEventListener('change',()=>{ updateLists({resetOnCategoryChange:true}); saveForm(); });
['brand','model','serial','year','requestType','problem','diagnosis','action','status','notes','address','sc','payment'].forEach(id=>{
  const el=els[id]; el.addEventListener('input',saveForm); el.addEventListener('change',()=>{ saveForm(); checkDelButtons(); });
});

/* Add buttons */
els.addCategoryBtn.onclick=promptAddCategory;
els.addBrandBtn.onclick=()=>promptAddCustom('brand');
els.addProblemBtn.onclick=()=>promptAddCustom('problem');
els.addDiagnosisBtn.onclick=()=>promptAddCustom('diagnosis');
els.addActionBtn.onclick=()=>promptAddCustom('action');
els.addStatusBtn.onclick=()=>promptAddCustom('status');

/* Delete buttons */
els.delCustomCategory.onclick=delCustomCategory;
[els.brand,els.problem,els.diagnosis,els.action,els.status].forEach(sel=>{ sel.addEventListener('change',checkDelButtons); });

/* Clear form */
els.clearBtn.onclick=()=>{
  if(!confirm('Clear form?')) return;
  els.repairForm.reset(); localStorage.removeItem(FORM_KEY);
  updateLists(); ['model','serial','year','requestType','notes','address','sc','payment'].forEach(k=>els[k].value='');
  checkDelButtons();
};

/* Submit -> generate OR save edit */
els.repairForm.onsubmit=(e)=>{
  e.preventDefault();
  if(editingIndex!==null){
    const existing=allReports[editingIndex];
    const updated=makeReportObj(existing);          // preserve ticket/date
    allReports[editingIndex]=updated;
    localStorage.setItem('repairReportsV3',JSON.stringify(allReports));
    renderReports();
    alert(`Ticket #${existing.ticketNo} updated!`);
    editingIndex=null; els.genBtn.textContent='📋 Generate Report'; els.editBanner.style.display='none';
    return;
  }
  const r=makeReportObj(null);
  allReports.push(r);
  localStorage.setItem('repairReportsV3',JSON.stringify(allReports));
  renderReports();
  alert('Report Generated & Saved!');
};

/* INIT */
window.addEventListener('load',()=>{
  fillCategory(); fillStatus(); fillPayment(); fillRequestType();
  updateModeButtons(); updateLists(); loadForm(); renderReports();
});
</script>
