<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Appliance Repair Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
  :root{--primary:#34c759;--primary-dark:#30d158;--background:#111;--surface:#232324;--surface-2:#29292B;--surface-3:#323236;--text:#fff;--text-secondary:#bcbcc7;--border:#34343B;--shadow:rgba(0,0,0,0.24);}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--background);color:var(--text);margin:0;}
  .container{max-width:640px;margin:0 auto;min-height:100vh;padding:24px 6vw 36px;}
  .header{text-align:center;margin-top:8px;margin-bottom:32px;}
  .logo{width:62px;height:62px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:15px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 18px rgba(52,199,89,0.18);}
  .title{font-size:2rem;font-weight:800;margin-bottom:7px;text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .subtitle{color:var(--text-secondary);font-size:16px;font-weight:500;}
  .mode-toggle{display:flex;max-width:300px;margin:23px auto 0;background:var(--surface);border-radius:12px;box-shadow:inset 0 1px 3px var(--shadow);}
  .mode-btn{flex:1;padding:13px 10px;border:none;background:none;color:var(--text-secondary);border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;}
  .mode-btn.active{background:var(--primary);color:var(--text);box-shadow:0 2px 8px rgba(52,199,89,0.23);}
  .form-section{background:var(--surface);border-radius:18px;padding:26px 21px;margin-bottom:20px;border:1.4px solid var(--border);}
  .section-title{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:17px;}
  .form-group{margin-bottom:18px;display:flex;flex-direction:column;}
  .label{font-weight:650;margin-bottom:6px;color:var(--text);font-size:15px;}
  select,input,textarea{width:100%;padding:12px;background:var(--surface-2);border:1.3px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;}
  textarea{min-height:90px;resize:vertical;line-height:1.54;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:540px){.form-row{grid-template-columns:1fr;gap:13px;}}
  .action-buttons{display:flex;gap:11px;margin-top:24px;}
  .btn{flex:1;padding:14px 0;border:none;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--text);}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .report-output{background:var(--surface);border-radius:17px;padding:20px;margin-top:18px;border:1.2px solid var(--border);}
  .report-title{font-size:20px;font-weight:700;margin-bottom:12px;color:var(--primary);}
  .report-line{margin-bottom:8px;padding:5px 0;border-bottom:1px solid var(--border);}
  .report-label{font-weight:700;color:var(--text-secondary);font-size:13px;text-transform:uppercase;}
  .report-value{font-size:15.6px;color:var(--text);}
  .report-actions{display:flex;gap:8px;margin-top:12px;}
  .btn-mini{flex:unset;padding:8px 10px;border-radius:8px;font-weight:700;font-size:13.5px;}
  .input-dollar{display:flex;align-items:center;}
  .input-dollar .dollar-sign{margin-right:5px;color:#aaa;}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🔧</div>
    <h1 class="title">Appliance Repair Pro</h1>
    <p class="subtitle">Professional Service Reports</p>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeTech">👨‍🔧 Technician</button>
      <button class="mode-btn" id="modeClient">👤 Client</button>
    </div>
  </div>

  <form id="repairForm" autocomplete="off">
    <div class="form-section">
      <div class="section-title">🏠 Appliance Information</div>

      <div class="form-group">
        <label class="label">Appliance Type</label>
        <div class="select-group">
          <select id="category"><option value="">Select Appliance Type</option></select>
          <button type="button" class="custom-add-btn" id="addCategoryBtn">+</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Brand</label>
          <div class="select-group">
            <select id="brand"><option value="">Select Brand</option></select>
            <button type="button" class="custom-add-btn" id="addBrandBtn">+</button>
          </div>
        </div>
        <div class="form-group">
          <label class="label">Model</label>
          <input type="text" id="model" placeholder="Enter model number"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Serial Number</label>
          <input type="text" id="serial" placeholder="Enter serial number"/>
        </div>
        <div class="form-group">
          <label class="label">Year of Manufacture</label>
          <input type="text" id="year" placeholder="MM.YYYY or MM/YYYY"/>
        </div>
      </div>
    </div>

        <div class="form-section">
      <div class="section-title">🔍 Service Details</div>

      <div class="form-group">
        <label class="label">Problem</label>
        <div class="select-group">
          <select id="problem"><option value="">Select Problem</option></select>
          <button type="button" class="custom-add-btn" id="addProblemBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Diagnosis</label>
        <div class="select-group">
          <select id="diagnosis"><option value="">Select Diagnosis</option></select>
          <button type="button" class="custom-add-btn" id="addDiagnosisBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Action Taken</label>
        <div class="select-group">
          <select id="action"><option value="">Select Action</option></select>
          <button type="button" class="custom-add-btn" id="addActionBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Status</label>
        <div class="select-group">
          <select id="status"><option value="">Select Status</option></select>
          <button type="button" class="custom-add-btn" id="addStatusBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Request Type</label>
        <div class="select-group">
          <select id="requestType"><option value="">Select Request Type</option></select>
          <button type="button" class="custom-add-btn" id="addRequestTypeBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Additional Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="form-group input-dollar">
        <label class="label">Service Call Fee</label>
        <span class="dollar-sign">$</span>
        <input type="number" id="sc" placeholder="0" min="0" step="1"/>
      </div>

      <div class="form-group">
        <label class="label">Payment Method</label>
        <div class="select-group">
          <select id="payment"><option value="">Select Payment</option></select>
          <button type="button" class="custom-add-btn" id="addPaymentBtn">+</button>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button type="submit" class="btn btn-primary" id="genBtn">📋 Generate Report</button>
      <button type="button" class="btn btn-secondary" id="clearBtn">🗑️ Clear Form</button>
    </div>
  </form>

  <div id="allReportsBlock"></div>

  <script>
/* ===== Built-in data ===== */
const builtinCategories = [
  {key:'refrigerator', en:'Refrigerator'},
  {key:'dishwasher', en:'Dishwasher'},
  {key:'washing_machine', en:'Washing Machine'},
  {key:'dryer', en:'Dryer'},
  {key:'stove_oven', en:'Stove/Oven'},
  {key:'microwave', en:'Microwave'}
];

const builtinStatuses = [
  {en:"✅ Fixed"},
  {en:"⏳ Parts needed"},
  {en:"🔧 Temporary Fix"},
  {en:"❌ Not Repairable"}
];

const builtinRequestTypes = [
  {en:"🆕 New"},
  {en:"🔁 Recall"},
  {en:"🧰 Install Parts Visit"}
];

const builtinPayments = [
  {en:"💳 Card"},
  {en:"💵 Cash"},
  {en:"📝 Check"},
  {en:"🔗 Link"}
];

/* ===== State ===== */
let currentMode = 'technician';
let allReports = JSON.parse(localStorage.getItem('repairReportsV4')||'[]');

const $=id=>document.getElementById(id);
const els={
  repairForm:$('repairForm'),
  category:$('category'), brand:$('brand'), model:$('model'),
  serial:$('serial'), year:$('year'),
  problem:$('problem'), diagnosis:$('diagnosis'), action:$('action'),
  status:$('status'), requestType:$('requestType'),
  notes:$('notes'), sc:$('sc'), payment:$('payment'),
  modeTech:$('modeTech'), modeClient:$('modeClient'),
  genBtn:$('genBtn'), clearBtn:$('clearBtn'),
  reportsBlock:$('allReportsBlock'),
  addCategoryBtn:$('addCategoryBtn'), addBrandBtn:$('addBrandBtn'),
  addProblemBtn:$('addProblemBtn'), addDiagnosisBtn:$('addDiagnosisBtn'),
  addActionBtn:$('addActionBtn'), addStatusBtn:$('addStatusBtn'),
  addRequestTypeBtn:$('addRequestTypeBtn'), addPaymentBtn:$('addPaymentBtn')
};

/* ===== Ticket counter (reset daily) ===== */
function nextTicketNumber(){
  const today = new Date().toISOString().slice(0,10);
  const store = JSON.parse(localStorage.getItem('ticketCounter')||'{}');
  if(store.date !== today){
    store.date = today;
    store.counter = 1;
  } else {
    store.counter = (store.counter||0)+1;
  }
  localStorage.setItem('ticketCounter', JSON.stringify(store));
  return store.counter;
}

/* ===== Fill selects ===== */
function fillSelect(select, list, placeholder){
  select.innerHTML = `<option value="">${placeholder}</option>`;
  list.forEach(o=>{
    select.innerHTML += `<option value="${o.en}">${o.en}</option>`;
  });
}
function fillCategory(){ fillSelect(els.category, builtinCategories, "Select Appliance Type"); }
function fillStatus(){ fillSelect(els.status, builtinStatuses, "Select Status"); }
function fillRequestType(){ fillSelect(els.requestType, builtinRequestTypes, "Select Request Type"); }
function fillPayment(){ fillSelect(els.payment, builtinPayments, "Select Payment"); }

/* ===== Report builder ===== */
function makeReportObj(){
  const dateISO = new Date().toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'});
  const ticketNo = nextTicketNumber();
  return {
    dateISO,
    ticketNo,
    mode:currentMode,
    category:els.category.value,
    brand:els.brand.value,
    model:els.model.value,
    serial:els.serial.value,
    year:els.year.value,
    problem:els.problem.value,
    diagnosis:els.diagnosis.value,
    action:els.action.value,
    status:els.status.value,
    requestType:els.requestType.value,
    notes:els.notes.value,
    sc:els.sc.value,
    payment:els.payment.value
  };
}

function line(label,val){
  if(!val) return '';
  return `<div class="report-line"><span class="report-label">${label}:</span> <span class="report-value">${val}</span></div>`;
}

function makeReportBlock(r, idx){
  const title=(r.mode==='technician'?'Technician Report':'Client Report');
  let html=`<div class="report-output" data-idx="${idx}">
    <div class="report-title">${title} — ${r.dateISO} — Заявка №${r.ticketNo}</div>
    <div class="report-content">`;
  html+=line('Appliance', r.category);
  html+=line('Brand', r.brand);
  html+=line('Model', r.model);
  html+=line('Serial', r.serial);
  html+=line('Year', r.year);
  html+=line('Problem', r.problem);
  html+=line('Diagnosis', r.diagnosis);
  html+=line('Action', r.action);
  html+=line('Status', r.status);
  html+=line('Request', r.requestType);
  html+=line('Notes', r.notes);
  html+=line('SC', r.sc?('$'+r.sc):'');
  html+=line('Payment', r.payment);
  html+=`</div>
    <div class="report-actions">
      <button class="btn btn-secondary btn-mini" onclick="editReport(${idx})">Edit</button>
      <button class="btn btn-secondary btn-mini" onclick="deleteReport(${idx})">Delete</button>
    </div>
  </div>`;
  return html;
}

function renderReports(){
  let html='';
  if(allReports.length){
    html+=`<div id="reportsControlBtns">
      <button class="btn btn-secondary" onclick="clearReports()">Clear All</button>
    </div>`;
    allReports.forEach((r,i)=>{ html+=makeReportBlock(r,i); });
  }
  els.reportsBlock.innerHTML=html;
}

/* ===== Edit/Delete ===== */
function editReport(idx){
  const r = allReports[idx];
  if(!r) return;
  const ask = (label, cur)=>prompt(label, cur??'');
  const fields=['brand','model','serial','year','problem','diagnosis','action','status','requestType','notes','sc','payment'];
  fields.forEach(f=>{
    const val=ask(f, r[f]);
    if(val!==null) r[f]=val.trim();
  });
  localStorage.setItem('repairReportsV4', JSON.stringify(allReports));
  renderReports();
}
function deleteReport(idx){
  if(!confirm('Delete this report?')) return;
  allReports.splice(idx,1);
  localStorage.setItem('repairReportsV4',JSON.stringify(allReports));
  renderReports();
}
function clearReports(){
  if(!confirm('CLEAR ALL REPORTS?')) return;
  allReports=[];
  localStorage.removeItem('repairReportsV4');
  renderReports();
}

/* ===== Events ===== */
els.repairForm.onsubmit=(e)=>{
  e.preventDefault();
  const r=makeReportObj();
  allReports.push(r);
  localStorage.setItem('repairReportsV4',JSON.stringify(allReports));
  renderReports();
  alert('Report Generated & Saved!');
};
els.clearBtn.onclick=()=>{
  if(!confirm('Clear form?')) return;
  els.repairForm.reset();
};

/* Mode toggle */
els.modeTech.onclick=()=>{ currentMode='technician'; els.modeTech.classList.add('active'); els.modeClient.classList.remove('active'); };
els.modeClient.onclick=()=>{ currentMode='client'; els.modeClient.classList.add('active'); els.modeTech.classList.remove('active'); };

/* INIT */
window.addEventListener('load',()=>{
  fillCategory(); fillStatus(); fillRequestType(); fillPayment();
  renderReports();
});
</script>

  </div> <!-- /container -->
</body>
</html>
