<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Appliance Repair Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
  :root{--primary:#34c759;--primary-dark:#30d158;--background:#111;--surface:#232324;--surface-2:#29292B;--surface-3:#323236;--text:#fff;--text-secondary:#bcbcc7;--border:#34343B;--shadow:rgba(0,0,0,0.24);}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--background);color:var(--text);margin:0;}
  .container{max-width:640px;margin:0 auto;min-height:100vh;padding:24px 6vw 36px;}
  .header{text-align:center;margin-top:8px;margin-bottom:32px;}
  .logo{width:62px;height:62px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:15px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 18px rgba(52,199,89,0.18);}
  .title{font-size:2rem;font-weight:800;margin-bottom:7px;text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .subtitle{color:var(--text-secondary);font-size:16px;font-weight:500;}
  .mode-toggle{display:flex;max-width:300px;margin:23px auto 0;background:var(--surface);border-radius:12px;box-shadow:inset 0 1px 3px var(--shadow);}
  .mode-btn{flex:1;padding:13px 10px;border:none;background:none;color:var(--text-secondary);border-radius:9px;font-weight:700;font-size:15px;transition:all .22s cubic-bezier(.25,.46,.45,.94);cursor:pointer;}
  .mode-btn.active{background:var(--primary);color:var(--text);box-shadow:0 2px 8px rgba(52,199,89,0.23);}
  .form-section{background:var(--surface);border-radius:18px;padding:26px 21px 22px;margin-bottom:20px;border:1.4px solid var(--border);box-shadow:0 2px 22px rgba(0,0,0,0.07);}
  @media(max-width:600px){.form-section{padding:18px 6vw;}}
  .section-title{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:17px;}
  .form-group{margin-bottom:23px;display:flex;flex-direction:column;align-items:stretch;}
  .form-group:last-child{margin-bottom:0;}
  .label{font-weight:650;margin-bottom:6px;margin-top:2px;color:var(--text);font-size:15.4px;}
  .translation{color:var(--text-secondary);font-size:13.3px;font-style:italic;display:block;}
  .translation.hidden{display:none;}
  select,input,textarea{width:100%;padding:14px;background:var(--surface-2);border:1.3px solid var(--border);border-radius:10px;color:var(--text);font-size:15.5px;font-family:inherit;transition:border .21s,background .21s;appearance:none;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);}
  select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bbbbbb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 15px center;background-size:18px;padding-right:43px;cursor:pointer;}
  textarea{min-height:90px;resize:vertical;line-height:1.54;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:540px){.form-row{grid-template-columns:1fr;gap:13px;}}
  .action-buttons{display:flex;gap:11px;margin-top:33px;}
  .btn{flex:1;padding:14px 0;border:none;border-radius:11px;font-weight:700;font-size:15.7px;transition:background .19s,transform .14s;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--text);}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-primary:hover{background:var(--primary-dark);filter:brightness(1.04);}
  .btn-secondary:hover{background:var(--surface-3);}
  .report-output{background:var(--surface);border-radius:17px;padding:25px 10px 10px;margin-top:22px;border:1.2px solid var(--border);}
  .report-title{font-size:20px;font-weight:700;margin-bottom:12px;color:var(--primary);}
  .report-content{line-height:1.66;}
  .report-line{margin-bottom:10px;padding:7px 0;border-bottom:1px solid var(--border);}
  .report-line:last-child{border-bottom:none;margin-bottom:0;}
  .report-label{font-weight:700;color:var(--text-secondary);font-size:13px;text-transform:uppercase;letter-spacing:.3px;}
  .report-value{font-size:15.6px;color:var(--text);}
  .report-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .btn-mini{flex:unset;padding:8px 10px;border-radius:8px;font-weight:700;font-size:13.5px;}
  .input-dollar{position:relative;display:flex;align-items:center;}
  .input-dollar .dollar-sign{display:inline-block;width:27px;min-width:27px;text-align:center;font-size:17px;color:#aaa;pointer-events:none;line-height:1;margin-right:2px;}
  .input-dollar input[type="number"]{padding-left:0;flex:1;}
  .select-group{display:flex;align-items:center;gap:3px;}
  .custom-add-btn{background:var(--primary);color:#fff;border:none;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:17px;margin-left:3px;}
  .custom-add-btn:hover{background:var(--primary-dark);}
  .custom-del-btn{background:#f34e4e;color:#fff;border:none;border-radius:7px;padding:3px 9px;font-size:17px;cursor:pointer;display:inline-block;vertical-align:middle;margin-left:2px;}
  .custom-del-btn:hover{background:#c93434;}
  #allReportsBlock>.report-output{margin-top:18px;}
  #reportsControlBtns{margin:18px 0 4px;display:flex;gap:10px;flex-wrap:wrap;}
  ::selection{background:var(--primary-dark);color:#fff;}
  @media (max-width:540px){.container{padding:9px 0 29px;}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🔧</div>
    <h1 class="title">Appliance Repair Pro</h1>
    <p class="subtitle">Professional Service Reports</p>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="technician" id="modeTech">👨‍🔧 Technician</button>
      <button class="mode-btn" data-mode="client" id="modeClient">👤 Client</button>
    </div>
  </div>

  <form id="repairForm" autocomplete="off">
    <div class="form-section">
      <div class="section-title">🏠 Appliance Information</div>

      <div class="form-group">
        <label class="label">Appliance Type <span class="translation">Тип техники</span></label>
        <div class="select-group">
          <select id="category"><option value="">Select Appliance Type</option></select>
          <button type="button" class="custom-add-btn" id="addCategoryBtn" title="Add Appliance Type">+</button>
          <button type="button" class="custom-del-btn" id="delCustomCategory" style="display:none;" title="Delete this custom type">🗑️</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Brand <span class="translation">Бренд</span></label>
          <div class="select-group">
            <select id="brand"><option value="">Select Brand</option></select>
            <button type="button" class="custom-add-btn" title="Add Brand" id="addBrandBtn">+</button>
            <button type="button" class="custom-del-btn" id="delCustomBrand" style="display:none;" title="Delete this custom option">🗑️</button>
          </div>
        </div>
        <div class="form-group">
          <label class="label">Model <span class="translation">Модель</span></label>
          <input type="text" id="model" placeholder="Enter model number"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Serial Number <span class="translation">Серийный номер</span></label>
          <input type="text" id="serial" placeholder="Enter serial number" />
        </div>
        <div class="form-group">
          <label class="label">Year of Manufacture <span class="translation">Месяц и год выпуска (MM.YYYY или MM/YYYY)</span></label>
          <input type="text" id="year" placeholder="MM.YYYY или MM/YYYY" maxlength="7"/>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">🔍 Service Details</div>

      <div class="form-group">
        <label class="label">Problem <span class="translation">Проблема</span></label>
        <div class="select-group">
          <select id="problem"><option value="">Select Problem</option></select>
          <button type="button" class="custom-add-btn" title="Add Problem" id="addProblemBtn">+</button>
          <button type="button" class="custom-del-btn" id="delCustomProblem" style="display:none;" title="Delete this custom option">🗑️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Diagnosis <span class="translation">Диагноз</span></label>
        <div class="select-group">
          <select id="diagnosis"><option value="">Select Diagnosis</option></select>
          <button type="button" class="custom-add-btn" title="Add Diagnosis" id="addDiagnosisBtn">+</button>
          <button type="button" class="custom-del-btn" id="delCustomDiagnosis" style="display:none;" title="Delete this custom option">🗑️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Action Taken <span class="translation">Выполненные действия</span></label>
        <div class="select-group">
          <select id="action"><option value="">Select Action</option></select>
          <button type="button" class="custom-add-btn" title="Add Action" id="addActionBtn">+</button>
          <button type="button" class="custom-del-btn" id="delCustomAction" style="display:none;" title="Delete this custom option">🗑️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Status <span class="translation">Статус</span></label>
        <div class="select-group">
          <select id="status"><option value="">Select Status</option></select>
          <button type="button" class="custom-add-btn" id="addStatusBtn" title="Add Status">+</button>
          <button type="button" class="custom-del-btn" id="delCustomStatus" style="display:none;" title="Delete this custom status">🗑️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Additional Notes <span class="translation">Дополнительные заметки</span></label>
        <textarea id="notes" placeholder="Enter any additional details or recommendations..."></textarea>
      </div>

      <div class="form-group input-dollar">
        <label class="label">Service Call Fee <span class="translation">Плата за выезд мастера</span></label>
        <span class="dollar-sign" aria-label="Dollar">$</span>
        <input type="number" id="sc" placeholder="0" min="0" step="1" inputmode="numeric" />
      </div>

      <!-- NEW: Payment row -->
      <div class="form-row">
        <div class="form-group">
          <label class="label">Payment Method <span class="translation">Способ оплаты</span></label>
          <select id="payMethod">
            <option value="">Select Method</option>
            <option>Card</option>
            <option>Cash</option>
            <option>Check</option>
            <option>Link</option>
          </select>
        </div>
        <div class="form-group input-dollar">
          <label class="label">Received <span class="translation">Получено</span></label>
          <span class="dollar-sign" aria-label="Dollar">$</span>
          <input type="number" id="received" placeholder="0" min="0" step="1" inputmode="numeric" />
        </div>
      </div>
      <!-- /NEW -->
    </div>

    <div class="action-buttons">
      <button type="submit" class="btn btn-primary" id="genBtn">📋 Generate Report</button>
      <button type="button" class="btn btn-secondary" id="clearBtn">🗑️ Clear Form</button>
    </div>
  </form>

  <div id="allReportsBlock"></div>
</div>

/* ---- Migration from V3 (if exists) ---- */
(function migrateV3(){
  const v3 = localStorage.getItem('customOptionsV3');
  if(!v3) return;
  try{
    const old = JSON.parse(v3);
    ['brand','problem','diagnosis','action'].forEach(k=>{
      const obj = old[k]||{};
      Object.keys(obj).forEach(cat=>{
        custom[k][cat] = (custom[k][cat]||[]).concat(obj[cat]);
      });
    });
    localStorage.removeItem('customOptionsV3');
    localStorage.setItem('customOptionsV4',JSON.stringify(custom));
  }catch(e){}
})();

/* ===== Helpers ===== */
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||('cat_'+Date.now()); }
function categoryList(){ return [...builtinCategories, ...custom.category]; }

function mapsFor(catKey){
  const brands = (builtinBrands[catKey]||[]).concat( (custom.brand[catKey]||[]) );
  const problems = (builtinProblems[catKey]||[]).concat( (custom.problem[catKey]||[]) );
  const diagnosis = (builtinDiagnosis[catKey]||[]).concat( (custom.diagnosis[catKey]||[]) );
  const actions = (builtinActions[catKey]||[]).concat( (custom.action[catKey]||[]) );
  return {brands,problems,diagnosis,actions};
}

function ensureCustomCategory(catKey, en, ru){
  if(!custom.category.find(c=>c.key===catKey)){
    custom.category.push({key:catKey,en,ru});
  }
  if(!custom.problem[catKey]||custom.problem[catKey].length===0) custom.problem[catKey]=JSON.parse(JSON.stringify(universalProblems));
  if(!custom.diagnosis[catKey]||custom.diagnosis[catKey].length===0) custom.diagnosis[catKey]=JSON.parse(JSON.stringify(universalDiagnosis));
  if(!custom.action[catKey]||custom.action[catKey].length===0) custom.action[catKey]=JSON.parse(JSON.stringify(universalActions));
  if(!custom.brand[catKey]) custom.brand[catKey]=[];
  persistCustom();
}

function persistCustom(){ localStorage.setItem('customOptionsV4',JSON.stringify(custom)); }

/* fill select helpers */
function fillCategory(){
  const current=els.category.value;
  els.category.innerHTML='<option value="">Select Appliance Type</option>';
  categoryList().forEach(c=>{
    const label = `${c.en} / ${c.ru}`;
    els.category.innerHTML += `<option value="${c.key}">${label}</option>`;
  });
  if(current && categoryList().some(c=>c.key===current)) els.category.value=current;
}

function fillSelectENorObj(select, arr, placeholder){
  select.innerHTML = `<option value="">${placeholder}</option>`;
  arr.forEach(o=>{
    if(typeof o==='string'){
      select.innerHTML += `<option value="${o}">${o}</option>`;
    }else{
      select.innerHTML += `<option value="${o.en}">${o.en} / ${o.ru}</option>`;
    }
  });
}

function fillStatus(){
  const list = [...builtinStatuses, ...(custom.status||[])];
  fillSelectENorObj(els.status, list, 'Select Status');
}

/* main update */
function updateLists(){
  fillCategory();
  const cat=els.category.value;
  if(!cat){
    ['brand','problem','diagnosis','action'].forEach(id=>els[id].innerHTML=`<option value="">Select ${id[0].toUpperCase()+id.slice(1)}</option>`);
    fillStatus();
    checkDelButtons();
    return;
  }
  const {brands,problems,diagnosis,actions} = mapsFor(cat);
  fillSelectENorObj(els.brand, brands, 'Select Brand');
  fillSelectENorObj(els.problem, problems, 'Select Problem');
  fillSelectENorObj(els.diagnosis, diagnosis, 'Select Diagnosis');
  fillSelectENorObj(els.action, actions, 'Select Action');
  fillStatus();
  checkDelButtons();
}

/* delete buttons visibility */
function checkDelButtons(){
  const cat=els.category.value;

  const isCustomCat = custom.category.some(c=>c.key===cat);
  els.delCustomCategory.style.display = (cat && isCustomCat)?'inline-block':'none';

  const check = (key, selectEl, btnEl)=>{
    if(!cat){ btnEl.style.display='none'; return; }
    const customs=(custom[key][cat]||[]);
    const val = selectEl.value;
    const idx = customs.findIndex(o=> (typeof o==='string'?o:(o.en||''))===val );
    btnEl.style.display = (idx!==-1)?'inline-block':'none';
    btnEl.onclick = ()=>delCustomOption(key,cat,val);
  };
  check('brand',els.brand,els.delCustomBrand);
  check('problem',els.problem,els.delCustomProblem);
  check('diagnosis',els.diagnosis,els.delCustomDiagnosis);
  check('action',els.action,els.delCustomAction);

  const stVal = els.status.value;
  const stIdx = (custom.status||[]).findIndex(o=>o.en===stVal);
  els.delCustomStatus.style.display = stIdx!==-1?'inline-block':'none';
  els.delCustomStatus.onclick = ()=>delCustomStatus(stVal);
}

/* adders / deleters */
function promptAddCategory(){
  const en=prompt("Enter new Appliance Type (EN):"); if(!en||!en.trim()) return;
  const ru=prompt("Введите перевод Appliance Type (RU):",en)||en;
  const key = slugify(en);
  ensureCustomCategory(key,en.trim(),(ru||en).trim());
  persistCustom();
  updateLists();
  els.category.value = key;
  updateLists();
}

function promptAddCustom(type){
  const cat=els.category.value;
  if(type!=='status' && !cat){ alert('Choose Appliance Type first'); return; }

  const en=prompt(`Enter new ${type} (EN):`); if(!en||!en.trim()) return;
  const ru = (type==='brand')? null : (prompt(`Введите перевод ${type} (RU):`,en)||en);

  if(type==='status'){
    custom.status = custom.status||=[];
    custom.status.push({en:en.trim(), ru:(ru||en).trim()});
  }else if(type==='brand'){
    custom.brand[cat]=custom.brand[cat]||[];
    custom.brand[cat].push(en.trim());
  }else{
    custom[type][cat]=custom[type][cat]||[];
    custom[type][cat].push({en:en.trim(), ru:(ru||en).trim()});
  }
  persistCustom();
  updateLists();
  if(type==='status') els.status.value=en.trim(); else document.getElementById(type).value=en.trim();
  checkDelButtons();
}

function delCustomOption(key,cat,val){
  if(!confirm("Remove custom '"+val+"'?")) return;
  custom[key][cat]=(custom[key][cat]||[]).filter(o=> (typeof o==='string'?o:(o.en||''))!==val );
  persistCustom(); updateLists();
}
function delCustomCategory(){
  const cat=els.category.value;
  const obj = custom.category.find(c=>c.key===cat);
  if(!obj) return;
  if(!confirm(`Delete custom type '${obj.en}'? All its custom lists will be removed.`)) return;
  custom.category = custom.category.filter(c=>c.key!==cat);
  delete custom.brand[cat];
  delete custom.problem[cat];
  delete custom.diagnosis[cat];
  delete custom.action[cat];
  persistCustom();
  els.category.value='';
  updateLists();
}
function delCustomStatus(valEN){
  if(!confirm(`Remove custom status '${valEN}'?`)) return;
  custom.status = (custom.status||[]).filter(s=>s.en!==valEN);
  persistCustom(); updateLists();
}

/* translations & finding RU */
function findRuInList(arr,val){
  if(!val) return '';
  if(!arr||!arr.length) return '';
  if(typeof arr[0]==='string') return val; // brands
  const f = arr.find(o=>o.en===val);
  return f ? (f.ru||val) : val;
}
function findStatusRu(val){
  const list=[...builtinStatuses, ...(custom.status||[])];
  const f=list.find(s=>s.en===val);
  return f ? (f.ru||val) : val;
}

/* Report builders */
function prettyYear(val){
  if(!val) return '';
  const m=val.replace(/[^\d]/g,'').slice(0,6);
  if(m.length===6) return m.slice(0,2)+'.'+m.slice(2,6);
  return val;
}
function lineENRU(label,en,ru){
  if(!en && !ru) return '';
  if(currentMode==='technician' && ru && en && ru!==en) return `<div class="report-line"><span class="report-label">${label}:</span> <span class="report-value">${en} / ${ru}</span></div>`;
  return `<div class="report-line"><span class="report-label">${label}:</span> <span class="report-value">${en||ru||''}</span></div>`;
}
function reportToPlainText(r){
  const lines=[
    `${r.mode==='technician'?'Technician Report':'Client Report'} (${r.date.replace(/:\d+$/,'')})`,
    `Appliance: ${r.categoryLabel}`,
    `Brand: ${r.brand}${(currentMode==='technician'&&r.brand_ru&&r.brand_ru!==r.brand)?' / '+r.brand_ru:''}`,
    `Model: ${r.model||'-'}`,
    `Serial: ${r.serial||'-'}`,
    `Year: ${r.year||'-'}`,
    `Problem: ${r.problem||'-'}${(currentMode==='technician'&&r.problem_ru&&r.problem_ru!==r.problem)?' / '+r.problem_ru:''}`,
    `Diagnosis: ${r.diagnosis||'-'}${(currentMode==='technician'&&r.diagnosis_ru&&r.diagnosis_ru!==r.diagnosis)?' / '+r.diagnosis_ru:''}`,
    `Action: ${r.action||'-'}${(currentMode==='technician'&&r.action_ru&&r.action_ru!==r.action)?' / '+r.action_ru:''}`,
    `Status: ${r.status||'-'}${(currentMode==='technician'&&r.status_ru&&r.status_ru!==r.status)?' / '+r.status_ru:''}`,
    `Notes: ${r.notes||'-'}`,
    `SC: $${r.sc||'0'}`,
    `Payment: ${r.payMethod||'-'} — $${r.received||'0'}`
  ];
  return lines.join('\n');
}
function makeReportObj(){
  const catKey=els.category.value;
  const catObj = categoryList().find(c=>c.key===catKey);
  const catLabel = catObj ? `${catObj.en} / ${catObj.ru}` : '';

  const m = mapsFor(catKey||'');
  return {
    date:new Date().toLocaleString(), // seconds will be trimmed visually
    mode:currentMode,
    category:catKey,
    categoryLabel:catLabel,
    brand:els.brand.value||'',
    brand_ru: findRuInList(m.brands, els.brand.value),
    model:(els.model.value||'').trim(),
    serial:(els.serial.value||'').trim(),
    year:prettyYear((els.year.value||'').trim()),
    problem:els.problem.value||'',
    problem_ru:findRuInList(m.problems, els.problem.value),
    diagnosis:els.diagnosis.value||'',
    diagnosis_ru:findRuInList(m.diagnosis, els.diagnosis.value),
    action:els.action.value||'',
    action_ru:findRuInList(m.actions, els.action.value),
    status:els.status.value||'',
    status_ru:findStatusRu(els.status.value),
    notes:(els.notes.value||'').trim(),
    sc:(els.sc.value||'').trim(),
    payMethod:els.payMethod.value||'',
    received:(els.received.value||'').trim()
  };
}
function makeReportBlock(r, idx){

    <div class="report-title">${title} <span style="font-size:13px;color:#bcbcc7;">(${r.date.replace(/:\d+$/,'')})</span></div>
    <div class="report-content">`;
  html+=lineENRU('Appliance', r.categoryLabel, '');
  html+=lineENRU('Brand', r.brand, r.brand_ru);
  html+=lineENRU('Model', r.model,'');
  html+=lineENRU('Serial', r.serial,'');
  html+=lineENRU('Year', r.year,'');
  html+=lineENRU('Problem', r.problem, r.problem_ru);
  html+=lineENRU('Diagnosis', r.diagnosis, r.diagnosis_ru);
  html+=lineENRU('Action', r.action, r.action_ru);
  html+=lineENRU('Status', r.status, r.status_ru);
  html+=lineENRU('Notes', r.notes,'');
  html+=lineENRU('SC', (r.sc?('$'+r.sc):'$0'),'');
  html+=lineENRU('Payment', (r.payMethod?`${r.payMethod} — $${r.received||'0'}`:'-'), '');
  html+=`</div>
    <div class="report-actions">
      <button class="btn btn-secondary btn-mini" onclick="copyReport(${idx})">Copy</button>
      <button class="btn btn-secondary btn-mini" onclick="shareWhatsApp(${idx})">WhatsApp</button>
      <button class="btn btn-secondary btn-mini" onclick="printReport(${idx})">Print</button>
      <button class="btn btn-secondary btn-mini" onclick="loadReportToForm(${idx})">Edit</button>
      <button class="btn btn-secondary btn-mini" onclick="deleteReport(${idx})">Delete</button>
    </div>
  </div>`;
  return html;
}
function renderReports(){
  let html='';
  if(allReports.length){
    html+=`<div id="reportsControlBtns">
      <button class="btn btn-secondary" onclick="copyLastReport()">Copy Last</button>
      <button class="btn btn-secondary" onclick="copyAllReports()">Copy All</button>
      <button class="btn btn-secondary" onclick="clearReports()">Clear All</button>
    </div>`;
    allReports.forEach((r,i)=>{ html+=makeReportBlock(r,i); });
  }
  els.reportsBlock.innerHTML=html;
}

/* Actions */
function copyToClipboard(text){
  const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t);
  t.select(); document.execCommand('copy'); document.body.removeChild(t);
  alert('Copied!');
}
function copyReport(idx){ copyToClipboard(reportToPlainText(allReports[idx])); }
function copyLastReport(){ if(allReports.length) copyReport(allReports.length-1); else alert('No reports'); }
function copyAllReports(){ if(!allReports.length) return alert('No reports'); copyToClipboard(allReports.map(reportToPlainText).join('\n\n-------------------\n\n')); }
function shareWhatsApp(idx){ const text=encodeURIComponent(reportToPlainText(allReports[idx])); window.open(`https://wa.me/?text=${text}`,'_blank'); }
function printReport(idx){
  const text=reportToPlainText(allReports[idx]).replace(/\n/g,'<br>');
  const w=window.open('','_blank','width=720,height=900');
  w.document.write(`<html><head><title>Report</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:24px;line-height:1.5}</style></head><body>${text}</body></html>`);
  w.document.close(); w.focus(); w.print();
}
function deleteReport(idx){
  if(!confirm('Delete this report?')) return;
  allReports.splice(idx,1);
  localStorage.setItem('repairReportsV3',JSON.stringify(allReports));
  renderReports();
}
function clearReports(){
  if(!confirm('CLEAR ALL REPORTS?')) return;
  allReports=[];
  localStorage.removeItem('repairReportsV3');
  renderReports();
}
/* Edit -> load to form (не удаляет исходный отчёт) */
function loadReportToForm(idx){
  const r=allReports[idx];
  currentMode=r.mode||'technician';
  updateModeButtons();

  els.category.value=r.category||'';
  updateLists();

  // простые поля
  const map = ['brand','model','serial','year','problem','diagnosis','action','status','notes','sc','payMethod','received'];
  map.forEach(k=>{ if(els[k]) els[k].value = r[k]||''; });

  checkDelButtons();
  saveForm();
  window.scrollTo({top:0,behavior:'smooth'});
  alert('Loaded into form. Edit fields and click "Generate Report" to save a new entry.');
}

/* Autosave form */
const FORM_KEY='repairFormStateV4';
function saveForm(){
  const data={
    mode:currentMode,
    category:els.category.value, brand:els.brand.value, model:els.model.value,
    serial:els.serial.value, year:els.year.value,
    problem:els.problem.value, diagnosis:els.diagnosis.value, action:els.action.value,
    status:els.status.value, notes:els.notes.value, sc:els.sc.value,
    payMethod:els.payMethod.value, received:els.received.value
  };
  localStorage.setItem(FORM_KEY,JSON.stringify(data));
}
function loadForm(){
  const raw=localStorage.getItem(FORM_KEY);
  if(!raw) return;
  const d=JSON.parse(raw);
  if(d.mode){ currentMode=d.mode; updateModeButtons(); }
  if(d.category){ els.category.value=d.category; }
  updateLists();
  ['brand','model','serial','year','problem','diagnosis','action','status','notes','sc','payMethod','received'].forEach(k=>{
    if(d[k]!==undefined && d[k]!==null){ els[k].value=d[k]; }
  });
  checkDelButtons();
}

/* Mode + translations */
function updateModeButtons(){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  (currentMode==='technician'?els.modeTech:els.modeClient).classList.add('active');
  Array.from(document.querySelectorAll('.translation')).forEach(el=>{
    el.classList.toggle('hidden', currentMode==='client');
  });
}

/* Events */
els.modeTech.onclick=()=>{ currentMode='technician'; updateModeButtons(); saveForm(); renderReports(); };
els.modeClient.onclick=()=>{ currentMode='client'; updateModeButtons(); saveForm(); renderReports(); };

els.category.addEventListener('change',()=>{ updateLists(); saveForm(); });
['brand','model','serial','year','problem','diagnosis','action','status','notes','sc','payMethod','received'].forEach(id=>{
  const el=els[id];
  el.addEventListener('input',saveForm);
  el.addEventListener('change',()=>{ saveForm(); checkDelButtons(); });
});

/* Add buttons */
els.addCategoryBtn.onclick=promptAddCategory;
els.addBrandBtn.onclick=()=>promptAddCustom('brand');
els.addProblemBtn.onclick=()=>promptAddCustom('problem');
els.addDiagnosisBtn.onclick=()=>promptAddCustom('diagnosis');
els.addActionBtn.onclick=()=>promptAddCustom('action');
els.addStatusBtn.onclick=()=>promptAddCustom('status');

/* Delete buttons */
els.delCustomCategory.onclick=delCustomCategory;

/* show delete when selection changes */
[els.brand,els.problem,els.diagnosis,els.action,els.status].forEach(sel=>{
  sel.addEventListener('change',checkDelButtons);
});

/* Clear form */
els.clearBtn.onclick=()=>{
  if(!confirm('Clear form?')) return;
  els.repairForm.reset();
  localStorage.removeItem(FORM_KEY);
  updateLists();
  ['model','serial','year','notes','sc','payMethod','received'].forEach(k=>els[k].value='');
  checkDelButtons();
};

/* Submit -> generate report */
els.repairForm.onsubmit=(e)=>{
  e.preventDefault();
  const r=makeReportObj();
  allReports.push(r);
  localStorage.setItem('repairReportsV3',JSON.stringify(allReports)); // reuse same key for history
  renderReports();
  alert('Report Generated & Saved!');
};

/* INIT */
window.addEventListener('load',()=>{
  fillCategory();
  fillStatus();
  updateModeButtons();
  updateLists();
  loadForm();
  renderReports();
});
</script>
</body>
</html>
